# nginx site for the Genmars API on this machine.
# cloudflared forwards https://api.genmars.co.ke to http://127.0.0.1:8080 (see cloudflared.yml);
# nginx passes it on to the API container on 127.0.0.1:8000.
server {
    listen 127.0.0.1:8080;
    server_name api.genmars.co.ke;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Cloudflare terminates HTTPS; tell Django the original request was https
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;
    }
}
