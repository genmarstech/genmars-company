# nginx site for the Genmars APIs on this machine.
# cloudflared forwards https://api.genmars.co.ke to http://127.0.0.1:8080 (see cloudflared.yml);
# nginx passes meetings requests to the Meetings API (127.0.0.1:8001, backend-meetings/) and
# everything else to the main API (127.0.0.1:8000).
server {
    listen 127.0.0.1:8080;
    server_name api.genmars.co.ke;

    client_max_body_size 10m;

    proxy_set_header Host $host;
    # Cloudflare terminates HTTPS; tell Django the original request was https
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_read_timeout 60s;

    location /api/v1/meetings/ {
        proxy_pass http://127.0.0.1:8001;
    }

    location /api/v1/integrations/google/ {
        proxy_pass http://127.0.0.1:8001;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
