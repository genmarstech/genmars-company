services:
  genmarsdb:
    image: postgres:17-alpine
    container_name: genmars_db
    restart: unless-stopped

    # Credentials come from backend/.env (see .env.example); never hard-code them here.
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}

    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"

    volumes:
      - genmarsdb_data:/var/lib/postgresql/data

volumes:
  genmarsdb_data:
