# Render Blueprint: standby Django API for Genmars Tech.
# The primary API runs on Contabo; both servers share one managed Postgres (DATABASE_URL).
# Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: genmars-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: ./build.sh
    # Free instances have no pre-deploy step, so migrations run on start.
    startCommand: >-
      python manage.py migrate --no-input &&
      (python manage.py createsuperuser --no-input || true) &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      # Same database as the Contabo server, e.g. a Neon connection string.
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://company-v1-gamma.vercel.app
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://company-v1-gamma.vercel.app
      - key: ENQUIRY_NOTIFY_EMAIL
        value: info@genmars.co.ke
      - key: DEFAULT_FROM_EMAIL
        value: Genmars Tech <info@genmars.co.ke>
      # Set these in the dashboard (they are secrets):
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_FULL_NAME
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
